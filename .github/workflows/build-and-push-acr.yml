name: Build and Push to ACR

on:
  push:
    branches:
      - main  # Triggers the pipeline when you push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Log in to Azure Container Registry (ACR)
    - name: Azure Container Registry Login
      uses: azure/docker-login@v1
      with:
        login-server: mlprojectdocker.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Build the Docker Image and push it to your registry
    - name: Build and Push Docker Image
      run: |
        docker build -t mlprojectdocker.azurecr.io/ann-classification-regression:latest .
        docker push mlprojectdocker.azurecr.io/ann-classification-regression:latest

    # 4. Restart the Web App so it pulls the freshly-pushed image
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Restart Web App
      run: |
        az webapp restart --name ann-classification-regression --resource-group mlprojectdocker
